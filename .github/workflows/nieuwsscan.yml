name: AI-nieuwsscan

on:
  schedule:
    # Middernacht en middag Belgische tijd. Cron volgt geen zomertijd, dus deze
    # UTC-uren kloppen in de winter en lopen in de zomer een uur later
    # (01:00 en 13:00). GitHub start geplande runs zelden op de minuut.
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write   # om het bijgewerkte archief terug te committen
  pages: write      # om de site te publiceren
  id-token: write   # vereist door deploy-pages

# Nooit twee scans tegelijk, anders botsen de commits.
concurrency:
  group: nieuwsscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Vangnet: zonder dit stopt GitHub een vastgelopen job pas na 6 uur.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Zonder dit staat de runner op UTC en verschuiven alle artikeltijden
      # twee uur, waardoor nachtelijke artikelen onder de verkeerde dag komen.
      TZ: Europe/Brussels
      # Anders buffert Python zijn uitvoer en loopt de log achter op de scan.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan uitvoeren
        timeout-minutes: 20
        run: python ai_nieuwsscan.py

      - name: Archief en pagina vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html ai_artikelen.json
          git diff --staged --quiet || git commit -m "Nieuwsscan $(date +%F)"
          # Tijdens de scan kan er intussen iets naar main gepusht zijn. Haal dat
          # eerst binnen en zet de bot-commit erbovenop. Bij een conflict in de
          # gegenereerde bestanden wint de versie van deze scan (-X theirs is bij
          # een rebase de commit die herspeeld wordt, dus die van de bot).
          for poging in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push mislukt (poging $poging), opnieuw proberen..."
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
